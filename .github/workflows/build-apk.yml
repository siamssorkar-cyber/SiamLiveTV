name: Build Siam Live TV APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'SiamLiveTV_Android_Project.zip'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android SDK 35
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.7'

      - name: Extract project
        run: |
          unzip -o SiamLiveTV_Android_Project.zip
          test -f SiamLiveTV_Android/settings.gradle

      - name: Build debug APK
        run: |
          gradle -p SiamLiveTV_Android :app:assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SiamLiveTV-debug-apk
          path: SiamLiveTV_Android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
